</style></head><body><div class="app"><header class="top"><div class="toprow"><div class="brand"><img src="assets/super-sonic-grid-maker-brand.png"><div><b>Super Sonic</b><small>Grid Maker</small></div></div><div class="grow"></div><button class="iconbtn" id="undo" title="Annuler">↶</button><button class="iconbtn" id="redo" title="Rétablir">↷</button><button class="iconbtn" id="more" title="Plus">•••</button></div><div class="titlebar"><div class="songtitle" id="songTitle" contenteditable="true">Mon morceau</div><div class="meta" id="meta">C • 90 BPM • 4/4</div></div><div class="toolbar"><button class="btn primary" id="addSection">＋ Section</button><button class="btn" id="models">Tuiles modèles</button><button class="btn" id="pasteGrid">Coller</button><button class="btn" id="play">▶ Écouter</button><button class="btn" id="displayMode">♬ Accords</button></div></header><main class="main" id="main"></main><div class="playbar" id="playbar"><button class="iconbtn" id="playbarBtn">▶</button><div class="playinfo"><b id="playName">Pré-écoute</b><small id="playDetail">—</small><div class="progress"><i id="progress"></i></div></div><button class="btn" id="loop">Boucle</button></div><nav class="bottom"><div class="bottomnav"><button class="navbtn active" data-nav="grid"><span>▦</span>Grille</button><button class="navbtn" data-nav="models"><span>＋</span>Tuiles</button><button class="navbtn" data-nav="edit"><span>✎</span>Éditer</button><button class="navbtn" data-nav="listen"><span>◉</span>Écoute</button><button class="navbtn" data-nav="more"><span>•••</span>Plus</button></div></nav></div><div class="sheet" id="sheet"><div class="sheetcard"><div class="grab"></div><div id="sheetContent"></div></div></div><div class="toast" id="toast"></div><div id="printArea"></div><script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const roots=['C','C#','D','Eb','E','F','F#','G','Ab','A','Bb','B'];
const pcMap={'C':0,'B#':0,'C#':1,'Db':1,'D':2,'D#':3,'Eb':3,'E':4,'Fb':4,'E#':5,'F':5,'F#':6,'Gb':6,'G':7,'G#':8,'Ab':8,'A':9,'A#':10,'Bb':10,'B':11,'Cb':11};
const state={title:'Mon morceau',key:'C',tempo:90,meter:'4/4',mode:'chords',autoFit:true,fontSize:22,minFont:12,sections:[{id:id(),name:'Couplet',tiles:[tile('Cmaj7'),tile('Am7'),tile('Dm7'),tile('G7'),tile('Cmaj7'),tile('Am7'),tile('Dm7'),tile('G7')]}]};
function id(){return Math.random().toString(36).slice(2,9)} function tile(text=''){return {id:id(),text,sub:1,note:'',diagram:false}};
let selected=null, dragId=null, history=[], future=[], audio={ctx:null,timer:null,index:0,playing:false,loop:false,start:0,total:0};
function snapshot(){return JSON.stringify(state)} function pushHistory(){history.push(snapshot());if(history.length>80)history.shift();future=[]} function restore(s){Object.assign(state,JSON.parse(s));render();save()}
function save(){localStorage.setItem('ssgm-v8',snapshot())} function load(){try{const s=localStorage.getItem('ssgm-v8');if(s)Object.assign(state,JSON.parse(s))}catch(e){}}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function degree(chord,key){const m=String(chord||'').match(/^([A-G](?:#|b)?)(.*)$/);if(!m)return chord;const p=pcMap[m[1]];if(p==null)return chord;const k=pcMap[key]??0;let d=(p-k+12)%12;const map={0:'I',1:'♭II',2:'II',3:'♭III',4:'III',5:'IV',6:'♭V',7:'V',8:'♭VI',9:'VI',10:'♭VII',11:'VII'};let r=map[d];const q=m[2]||'';const lower=/^(m|min|dim|ø)/i.test(q);if(lower)r=r.toLowerCase();if(/dim|°/.test(q))r+='°';if(/aug|\+/.test(q))r+='+';if(/sus/.test(q))r+='sus';const seven=q.match(/(maj7|M7|m7|7|9|11|13|6)/);if(seven)r+=seven[1].replace('M7','maj7');return r}
function fitSize(t){if(!state.autoFit)return state.fontSize;const n=[...String(t||'')].length;return Math.max(state.minFont,Math.min(state.fontSize, 34-(n*1.45)))}
function shown(t){return state.mode==='degrees'?degree(t.text,state.key):t.text}
function render(){
 $('#songTitle').textContent=state.title;$('#meta').textContent=`${state.key} • ${state.tempo} BPM • ${state.meter}`;$('#displayMode').textContent=state.mode==='degrees'?'Ⅰ Degrés':'♬ Accords';
 const main=$('#main');main.innerHTML='';
 state.sections.forEach((sec,si)=>{const wrap=document.createElement('section');wrap.className='section';wrap.innerHTML=`<div class="sectionhead"><div class="sectionname" contenteditable="true" data-secname="${sec.id}">${esc(sec.name)}</div><div class="line"></div><div class="mini">${sec.tiles.length} mesures</div><button class="btn sectionmenu" data-sec="${sec.id}">•••</button></div><div class="tiles" data-section="${sec.id}"></div>`;main.appendChild(wrap);const cont=wrap.querySelector('.tiles');sec.tiles.forEach((t,i)=>{const el=document.createElement('div');el.className=`tile ${state.mode==='degrees'?'degree':''} ${selected===t.id?'selected':''}`;el.dataset.id=t.id;el.dataset.section=sec.id;el.draggable=false;const size=fitSize(shown(t));el.innerHTML=`<span class="num">${i+1}</span><span class="handle" title="Faire glisser">⠿</span><div class="tilebody"><input value="${esc(shown(t))}" aria-label="Mesure ${i+1}"></div>${t.sub===2?'<div class="sub2"></div>':''}${t.sub===4?'<div class="sub4"><i class="cross"></i></div>':''}`;const inp=el.querySelector('input');inp.style.fontSize=size+'px';inp.addEventListener('focus',()=>{selected=t.id});inp.addEventListener('input',e=>{if(state.mode==='chords'){if(!t._editing)pushHistory();t._editing=true;t.text=e.target.value;save()}});inp.addEventListener('blur',()=>{t._editing=false;render()});inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();focusNext(t.id)}});inp.addEventListener('pointerdown',e=>e.stopPropagation());el.addEventListener('click',e=>{if(e.target===inp)return;selected=t.id;render()});el.addEventListener('dblclick',e=>{if(e.target===inp)return;selected=t.id;openTileEditor(t,sec.id)});el.querySelector('.handle').addEventListener('pointerdown',e=>startDrag(e,sec.id,t.id));el.addEventListener('contextmenu',e=>{e.preventDefault();selected=t.id;openTileEditor(t,sec.id)});cont.appendChild(el)});const add=document.createElement('button');add.className='addtile';add.textContent='＋';add.onclick=()=>{pushHistory();sec.tiles.push(tile(''));render();save();focusTile(sec.tiles.at(-1).id)};cont.appendChild(add)});
 if(!state.sections.length)main.innerHTML='<div class="empty">Aucune section. Ajoute une section pour commencer.</div>';
 bindSections();updateNav();
}
function bindSections(){$$('[data-secname]').forEach(el=>el.addEventListener('blur',()=>{const sec=state.sections.find(s=>s.id===el.dataset.secname);if(sec&&sec.name!==el.textContent.trim()){pushHistory();sec.name=el.textContent.trim()||'Section';save();render()}}));$$('[data-sec]').forEach(b=>b.onclick=()=>{const sec=state.sections.find(s=>s.id===b.dataset.sec);openSectionMenu(sec)});}
function focusNext(tid){const all=[...document.querySelectorAll('.tile input')];const i=all.findIndex(x=>x.closest('.tile')?.dataset.id===tid);if(i>=0&&all[i+1])all[i+1].focus();else{$('.addtile')?.focus()}}
function focusTile(tid){setTimeout(()=>{const i=document.querySelector(`.tile[data-id="${tid}"] input`);if(i){i.focus();i.select()}},30)}
function startDrag(e,sid,tid){if(e.button!==undefined&&e.button!==0)return;dragId=tid;const el=e.currentTarget;let moved=false;const move=ev=>{if(!dragId)return;const dx=ev.clientX-e.clientX,dy=ev.clientY-e.clientY;if(Math.abs(dx)+Math.abs(dy)>6){moved=true;el.classList.add('dragging');const under=document.elementFromPoint(ev.clientX,ev.clientY)?.closest('.tile');$$('.tile.drop-target').forEach(x=>x.classList.remove('drop-target'));if(under&&under.dataset.id!==tid)under.classList.add('drop-target')}};const up=ev=>{document.removeEventListener('pointermove',move);document.removeEventListener('pointerup',up);el.classList.remove('dragging');$$('.tile.drop-target').forEach(x=>x.classList.remove('drop-target'));if(moved){const target=document.elementFromPoint(ev.clientX,ev.clientY)?.closest('.tile');if(target&&target.dataset.id!==tid){reorder(tid,target.dataset.id,target.dataset.section)}else{const sec=state.sections.find(s=>s.id===sid);if(sec){const idx=sec.tiles.findIndex(t=>t.id===tid);const other=state.sections.flatMap(s=>s.tiles).find(t=>t.id===tid);if(other&&ev.clientY<window.innerHeight-90){} }}}dragId=null};document.addEventListener('pointermove',move);document.addEventListener('pointerup',up)}
function reorder(tid,targetId,targetSid){let fromSec,fromIdx,obj;state.sections.forEach(s=>{const i=s.tiles.findIndex(t=>t.id===tid);if(i>=0){fromSec=s;fromIdx=i;obj=s.tiles[i]}});const toSec=state.sections.find(s=>s.id===targetSid);if(!obj||!toSec)return;pushHistory();fromSec.tiles.splice(fromIdx,1);let ti=toSec.tiles.findIndex(t=>t.id===targetId);if(ti<0)ti=toSec.tiles.length;toSec.tiles.splice(ti,0,obj);save();render()}
function findTile(tid){for(const s of state.sections){const t=s.tiles.find(x=>x.id===tid);if(t)return [t,s]}return []}
function openTileEditor(t,sec){openSheet(`<div class="sheethead"><h2>Éditer la mesure</h2><button class="iconbtn close">×</button></div><div class="editor"><div class="field"><label>Contenu</label><input id="editText" value="${esc(t.text)}" autofocus></div><div class="twocol"><div class="field"><label>Subdivisions</label><div class="seg" id="subSeg">${[1,2,4].map(n=>`<button data-subv="${n}" class="${t.sub===n?'on':''}">${n}</button>`).join('')}</div></div><div class="field"><label>Diagramme</label><div class="seg"><button id="diagToggle" class="${t.diagram?'on':''}">${t.diagram?'Oui':'Non'}</button></div></div></div><div class="field"><label>Annotation</label><textarea id="editNote" placeholder="Optionnel">${esc(t.note||'')}</textarea></div><div class="actions"><button class="btn primary" id="dup">Dupliquer</button><button class="btn" id="copyOne">Copier</button><button class="btn danger" id="del">Supprimer</button></div></div>`);$('#editText').addEventListener('input',e=>{t.text=e.target.value;save()});$('#editText').addEventListener('blur',()=>{pushHistory();save();render()});$('#editNote').addEventListener('input',e=>{t.note=e.target.value;save()});$$('[data-subv]').forEach(b=>b.onclick=()=>{pushHistory();t.sub=+b.dataset.subv;save();closeSheet();render()});$('#diagToggle').onclick=()=>{pushHistory();t.diagram=!t.diagram;save();closeSheet();render()};$('#dup').onclick=()=>{pushHistory();const i=sec.tiles.findIndex(x=>x.id===t.id);sec.tiles.splice(i+1,0,{...JSON.parse(JSON.stringify(t)),id:id()});save();closeSheet();render()};$('#copyOne').onclick=()=>{navigator.clipboard?.writeText(JSON.stringify({type:'ssgm-tile',tile:t}));toast('Tuile copiée');closeSheet()};$('#del').onclick=()=>{pushHistory();sec.tiles=sec.tiles.filter(x=>x.id!==t.id);save();closeSheet();render()}}
function openSectionMenu(sec){openSheet(`<div class="sheethead"><h2>${esc(sec.name)}</h2><button class="iconbtn close">×</button></div><div class="actions"><button class="btn primary" id="dupSec">⧉ Dupliquer</button><button class="btn" id="copySec">Copier</button><button class="btn" id="exportSec">Exporter texte</button><button class="btn danger" id="delSec">Supprimer</button></div>`);$('#dupSec').onclick=()=>{pushHistory();const c=JSON.parse(JSON.stringify(sec));c.id=id();c.name=sec.name+' copie';c.tiles.forEach(t=>t.id=id());state.sections.splice(state.sections.findIndex(s=>s.id===sec.id)+1,0,c);save();closeSheet();render()};$('#copySec').onclick=()=>{navigator.clipboard?.writeText(sec.tiles.map(t=>t.text).join(' | '));toast('Section copiée');closeSheet()};$('#exportSec').onclick=()=>{downloadText(sec.name+'.txt',sec.tiles.map(t=>t.text).join(' | '));closeSheet()};$('#delSec').onclick=()=>{pushHistory();state.sections=state.sections.filter(s=>s.id!==sec.id);save();closeSheet();render()}}
function openModels(){const models=[['ii–V–I',['Dm7','G7','Cmaj7']],['I–VI–II–V',['Cmaj7','Am7','Dm7','G7']],['Turnaround',['Cmaj7','A7','Dm7','G7']],['Blues 12',['C7','C7','C7','C7','F7','F7','C7','C7','G7','F7','C7','G7']],['Vamp',['Dm7','Dm7','G7','G7']],['Pop 4 accords',['C','G','Am','F']]];openSheet(`<div class="sheethead"><h2>Tuiles modèles</h2><button class="iconbtn close">×</button></div><div class="modelgrid">${models.map((m,i)=>`<button class="model" data-model="${i}"><b>${m[0]}</b><small>${m[1].length} mesures</small><div class="preview">${m[1].slice(0,5).map(x=>`<i>${x}</i>`).join('')}</div></button>`).join('')}</div><p class="meta" style="margin-top:14px">Touchez un modèle pour l'ajouter à la fin de la dernière section.</p>`);$$('[data-model]').forEach(b=>b.onclick=()=>{const models=[['ii–V–I',['Dm7','G7','Cmaj7']],['I–VI–II–V',['Cmaj7','Am7','Dm7','G7']],['Turnaround',['Cmaj7','A7','Dm7','G7']],['Blues 12',['C7','C7','C7','C7','F7','F7','C7','C7','G7','F7','C7','G7']],['Vamp',['Dm7','Dm7','G7','G7']],['Pop 4 accords',['C','G','Am','F']]];pushHistory();state.sections.at(-1).tiles.push(...models[+b.dataset.model][1].map(tile));save();closeSheet();render()})}
function openSheet(html){$('#sheetContent').innerHTML=html;$('#sheet').classList.add('open');$('#sheet').querySelector('.close')?.addEventListener('click',closeSheet)}function closeSheet(){$('#sheet').classList.remove('open');$('#sheetContent').innerHTML=''}$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet()});
function addSection(){pushHistory();state.sections.push({id:id(),name:'Nouvelle section',tiles:[tile(''),tile(''),tile(''),tile('')]});save();render()}
function more(){openSheet(`<div class="sheethead"><h2>Outils</h2><button class="iconbtn close">×</button></div><div class="actions"><button class="btn" id="settings">⚙ Réglages</button><button class="btn" id="exportSvg">SVG</button><button class="btn" id="exportPng">PNG</button><button class="btn" id="exportJpg">JPEG</button><button class="btn" id="pdf">PDF / Imprimer</button><button class="btn" id="exportTxt">Texte</button><button class="btn" id="exportJson">Projet .grid</button><button class="btn" id="importJson">Importer .grid</button><button class="btn" id="ireal">iReal Pro</button><button class="btn" id="musicxml">MusicXML</button></div>`);$('#settings').onclick=openSettings;$('#exportSvg').onclick=()=>{downloadText('super-sonic-grid-maker.svg',makeSVG());closeSheet()};$('#exportPng').onclick=()=>raster('png');$('#exportJpg').onclick=()=>raster('jpeg');$('#pdf').onclick=()=>{closeSheet();preparePrint();setTimeout(()=>window.print(),80)};$('#exportTxt').onclick=()=>{downloadText('super-sonic-grid-maker.txt',textExport());closeSheet()};$('#exportJson').onclick=()=>{downloadText('super-sonic-grid-maker.grid',snapshot());closeSheet()};$('#importJson').onclick=importProject;$('#ireal').onclick=()=>{downloadText('ireal-pro.txt',irealURL());toast('Lien iReal Pro copié dans le fichier');closeSheet()};$('#musicxml').onclick=()=>{downloadText('super-sonic-grid-maker.musicxml',musicXML());closeSheet()}};
function openSettings(){openSheet(`<div class="sheethead"><h2>Réglages</h2><button class="iconbtn close">×</button></div><div class="editor"><div class="field"><label>Tonalité</label><select id="key">${roots.map(r=>`<option ${r===state.key?'selected':''}>${r}</option>`).join('')}</select></div><div class="twocol"><div class="field"><label>Tempo</label><input id="tempo" type="number" min="30" max="240" value="${state.tempo}"></div><div class="field"><label>Métrique</label><select id="meter"><option ${state.meter==='4/4'?'selected':''}>4/4</option><option ${state.meter==='3/4'?'selected':''}>3/4</option><option ${state.meter==='6/8'?'selected':''}>6/8</option><option ${state.meter==='2/4'?'selected':''}>2/4</option></select></div></div><div class="field"><label>Affichage</label><div class="seg"><button id="chMode" class="${state.mode==='chords'?'on':''}">Accords</button><button id="degMode" class="${state.mode==='degrees'?'on':''}">Degrés</button></div></div><div class="field"><label>Taille automatique des accords</label><div class="seg"><button id="auto" class="${state.autoFit?'on':''}">${state.autoFit?'Activé':'Désactivé'}</button></div></div><div class="twocol"><div class="field"><label>Taille max</label><input id="maxfont" type="number" min="12" max="40" value="${state.fontSize}"></div><div class="field"><label>Taille min</label><input id="minfont" type="number" min="8" max="24" value="${state.minFont}"></div></div><button class="btn primary" id="saveSettings">Enregistrer</button></div>`);$('#key').onchange=e=>state.key=e.target.value;$('#tempo').oninput=e=>state.tempo=Math.max(30,Math.min(240,+e.target.value));$('#meter').onchange=e=>state.meter=e.target.value;$('#chMode').onclick=()=>{state.mode='chords';closeSheet();render()};$('#degMode').onclick=()=>{state.mode='degrees';closeSheet();render()};$('#auto').onclick=()=>{state.autoFit=!state.autoFit;openSettings()};$('#maxfont').oninput=e=>state.fontSize=+e.target.value;$('#minfont').oninput=e=>state.minFont=+e.target.value;$('#saveSettings').onclick=()=>{pushHistory();save();closeSheet();render()}}
function textExport(){return `${state.title}\nTonalité: ${state.key} • ${state.tempo} BPM • ${state.meter}\n\n`+state.sections.map(s=>`${s.name}\n${s.tiles.map(t=>t.text).join(' | ')}`).join('\n\n')}
function downloadText(name,text,type='text/plain'){const b=new Blob([text],{type});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
function makeSVG(){const W=1200, tileW=270,tileH=110,gap=12, margin=55;let y=110;let out=`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${Math.max(600,y)}" viewBox="0 0 ${W} ${Math.max(600,y)}"><rect width="100%" height="100%" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#111} .muted{fill:#666}</style><text x="${margin}" y="55" font-size="28" font-weight="700">${esc(state.title)}</text><text x="${W-margin}" y="55" text-anchor="end" font-size="13" class="muted">${esc(state.key)} • ${state.tempo} BPM • ${state.meter}</text>`;state.sections.forEach(s=>{out+=`<text x="${margin}" y="${y}" font-size="13" font-weight="700" letter-spacing="2">${esc(s.name.toUpperCase())}</text>`;y+=20;s.tiles.forEach((t,i)=>{const col=i%4,row=Math.floor(i/4),x=margin+col*(tileW+gap),yy=y+row*(tileH+gap);out+=`<rect x="${x}" y="${yy}" width="${tileW}" height="${tileH}" fill="#fbfaf6" stroke="#111"/>`;if(t.sub===2)out+=`<line x1="${x+tileW*.5}" y1="${yy-20}" x2="${x+tileW*.72}" y2="${yy+tileH+20}" stroke="#777"/>`;if(t.sub===4){out+=`<line x1="${x+tileW*.35}" y1="${yy-20}" x2="${x+tileW*.5}" y2="${yy+tileH+20}" stroke="#777"/><line x1="${x+tileW*.65}" y1="${yy-20}" x2="${x+tileW*.5}" y2="${yy+tileH+20}" stroke="#777"/>`};out+=`<text x="${x+tileW/2}" y="${yy+63}" text-anchor="middle" font-size="${Math.max(18,fitSize(shown(t)))}" font-weight="700">${esc(shown(t))}</text>${t.note?`<text x="${x+tileW/2}" y="${yy+94}" text-anchor="middle" font-size="9" class="muted">${esc(t.note)}</text>`:''}`});y+=Math.ceil(s.tiles.length/4)*(tileH+gap)+35});const H=y+30;out=out.replace(`height="${Math.max(600,110)}" viewBox="0 0 ${W} ${Math.max(600,110)}"`,`height="${H}" viewBox="0 0 ${W} ${H}"`);return out+'</svg>'}
function raster(kind){const svg=makeSVG(),blob=new Blob([svg],{type:'image/svg+xml'}),url=URL.createObjectURL(blob),img=new Image();img.onload=()=>{const scale=2, c=document.createElement('canvas');c.width=1200*scale;c.height=img.height*scale;const ctx=c.getContext('2d');ctx.fillStyle='white';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(img,0,0,c.width,c.height);c.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='super-sonic-grid-maker.'+(kind==='png'?'png':'jpg');a.click()},kind==='png'?'image/png':'image/jpeg',.95);URL.revokeObjectURL(url);closeSheet()};img.src=url}
function preparePrint(){const pa=$('#printArea');pa.innerHTML=`<div class="printpage"><div class="printhead"><div><div class="printtitle">${esc(state.title)}</div><div style="font-size:11px;margin-top:2mm">Super Sonic Grid Maker</div></div><div class="printmeta">Tonalité ${esc(state.key)}<br>${state.tempo} BPM • ${state.meter}</div></div>${state.sections.map(s=>`<div class="psection"><h3>${esc(s.name)}</h3><div class="ptiles">${s.tiles.map(t=>`<div class="ptile">${t.sub>1?'<i class="diag"></i>':''}<span>${esc(shown(t))}</span>${t.note?`<small>${esc(t.note)}</small>`:''}</div>`).join('')}</div></div>`).join('')}<div class="printfoot">${state.mode==='degrees'?'Affichage en degrés':'Affichage en accords'} • Super Sonic Grid Maker</div></div>`}
function irealURL(){const bars=state.sections.flatMap(s=>s.tiles.map(t=>t.text||'')).join('|');return `irealbook://Song=${encodeURIComponent(state.title)}=Composer=Style=${encodeURIComponent('Pop')}=${state.key}=n=${encodeURIComponent(bars)}`}
function musicXML(){const notes=state.sections.flatMap(s=>s.tiles.map(t=>t.text));return `<?xml version="1.0" encoding="UTF-8"?><score-partwise version="3.1"><work><work-title>${esc(state.title)}</work-title></work><part-list><score-part id="P1"><part-name>Chord Chart</part-name></score-part></part-list><part id="P1">${notes.map((n,i)=>`<measure number="${i+1}"><harmony><root><root-step>${esc((n.match(/^[A-G]/)||['C'])[0])}</root-step></root><kind text="${esc(n.replace(/^[A-G](?:#|b)?/,'')||'major')}">${esc(n.replace(/^[A-G](?:#|b)?/,'')||'major')}</kind></harmony><direction><direction-type><words>${esc(n)}</words></direction-type></direction></measure>`).join('')}</part></score-partwise>`}
function importProject(){const inp=document.createElement('input');inp.type='file';inp.accept='.grid,.json,application/json';inp.onchange=()=>{const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{pushHistory();Object.assign(state,JSON.parse(r.result));save();render();toast('Projet importé')}catch(e){toast('Fichier invalide')}};r.readAsText(f)};inp.click()}
function pasteGrid(){openSheet(`<div class="sheethead"><h2>Coller une grille</h2><button class="iconbtn close">×</button></div><div class="field"><label>Une mesure par barre verticale</label><textarea id="pasteText" placeholder="Cmaj7 | Am7 | Dm7 | G7"></textarea></div><button class="btn primary" id="doPaste" style="margin-top:12px;width:100%">Insérer</button>`);$('#doPaste').onclick=()=>{const vals=$('#pasteText').value.split(/[|\n;]/).map(x=>x.trim()).filter(Boolean);if(!vals.length)return;pushHistory();state.sections.at(-1).tiles.push(...vals.map(tile));save();closeSheet();render();toast(`${vals.length} mesures ajoutées`)}}
function updateNav(){$$('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.nav==='grid'))}
function toast(s){const t=$('#toast');t.textContent=s;t.classList.add('show');clearTimeout(t._x);t._x=setTimeout(()=>t.classList.remove('show'),1700)}
function selectedActions(){if(!selected)return;const [t,s]=findTile(selected);if(t)openTileEditor(t,s)}
$('#addSection').onclick=addSection;$('#models').onclick=openModels;$('#pasteGrid').onclick=pasteGrid;$('#more').onclick=more;$('#displayMode').onclick=()=>{pushHistory();state.mode=state.mode==='chords'?'degrees':'chords';save();render()};$('#undo').onclick=()=>{if(!history.length)return;future.push(snapshot());restore(history.pop())};$('#redo').onclick=()=>{if(!future.length)return;history.push(snapshot());restore(future.pop())};$('#songTitle').addEventListener('blur',()=>{const v=$('#songTitle').textContent.trim();if(v!==state.title){pushHistory();state.title=v||'Mon morceau';save();render()}});$('#play').onclick=()=>togglePlay();$('#playbarBtn').onclick=()=>togglePlay();$('#loop').onclick=()=>{audio.loop=!audio.loop;$('#loop').textContent=audio.loop?'Boucle ✓':'Boucle'};
window.addEventListener('keydown',e=>{const tag=document.activeElement?.tagName;if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='z'){e.preventDefault();$('#undo').click()}else if((e.metaKey||e.ctrlKey)&&(e.key.toLowerCase()==='y'||(e.shiftKey&&e.key.toLowerCase()==='z'))){e.preventDefault();$('#redo').click()}else if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='c'&&selected&&!['INPUT','TEXTAREA'].includes(tag)){const [t]=findTile(selected);navigator.clipboard?.writeText(t.text);toast('Mesure copiée')}else if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='v'&&!['INPUT','TEXTAREA'].includes(tag)){pasteGrid() }else if(e.key==='Delete'&&!['INPUT','TEXTAREA'].includes(tag)&&selected){const [t,s]=findTile(selected);if(t){pushHistory();s.tiles=s.tiles.filter(x=>x.id!==t.id);selected=null;save();render()}}else if(e.key==='Escape')closeSheet()});
function togglePlay(){if(audio.playing){stopAudio();return}const list=state.sections.flatMap((s,si)=>s.tiles.map((t,ti)=>({t,si,ti,s}))).filter(x=>x.t.text||x.t.note);if(!list.length){toast('Aucune mesure à lire');return}audio.ctx=audio.ctx||new (window.AudioContext||window.webkitAudioContext)();audio.ctx.resume();audio.playing=true;audio.index=0;audio.total=list.length;$('#playbar').classList.add('show');$('#play').textContent='■ Arrêter';$('#playbarBtn').textContent='■';playNext(list)}
function playNext(list){if(!audio.playing)return;if(audio.index>=list.length){if(audio.loop)audio.index=0;else{return stopAudio()}}const x=list[audio.index];selected=x.t.id;render();const root=(x.t.text.match(/^([A-G](?:#|b)?)/)||['C','C'])[1],pc=pcMap[root]??0;const now=audio.ctx.currentTime;[0,4,7,11].forEach((semi,j)=>{const o=audio.ctx.createOscillator(),g=audio.ctx.createGain();o.type='sine';o.frequency.value=130.81*Math.pow(2,(pc+semi)/12);g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.07/(j+1),now+.015);g.gain.exponentialRampToValueAtTime(.0001,now+0.55);o.connect(g).connect(audio.ctx.destination);o.start(now);o.stop(now+.58)});const ms=60000/state.tempo*(state.meter==='6/8'?6:4);audio.start=performance.now();audio.duration=ms;$('#playName').textContent=x.s.name+` • mesure ${x.ti+1}`;$('#playDetail').textContent=`${x.t.text||'Silence'} • ${state.tempo} BPM`;const tick=()=>{if(!audio.playing)return;$('#progress').style.width=Math.min(100,(performance.now()-audio.start)/ms*100)+'%'};clearInterval(audio.timer);audio.timer=setInterval(tick,30);setTimeout(()=>{audio.index++;playNext(list)},ms)}
function stopAudio(){audio.playing=false;clearInterval(audio.timer);$('#playbar').classList.remove('show');$('#play').textContent='▶ Écouter';$('#playbarBtn').textContent='▶';render()}
load();render();if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
